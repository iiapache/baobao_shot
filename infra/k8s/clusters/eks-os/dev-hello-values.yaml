# EKS 新加坡 — dev 环境 hello 服务 values

global:
  cluster: eks-os
  region: os
  environment: dev

replicaCount: 1

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: hello-dev-os.example.com
      paths:
        - path: /
          pathType: Prefix

commonLabels:
  baobao.io/team: infra
  baobao.io/tier: demo
