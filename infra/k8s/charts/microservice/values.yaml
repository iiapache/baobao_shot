# 默认 values — 生产/预发请使用 clusters/<cluster>/staging-*-values.yaml 覆盖

global:
  cluster: local
  region: cn
  environment: dev

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ""
  tag: staging
  pullPolicy: IfNotPresent

serviceAccount:
  create: false
  name: ""

podAnnotations: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false

# 明文 env（非敏感）
env: []
# map 形式，与 env 合并渲染
extraEnv: {}

# 从 Secret/ConfigMap 注入
envFrom: []

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

commonLabels: {}
commonAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
