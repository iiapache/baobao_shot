# cert-manager ClusterIssuer 占位
#
# 部署前替换 email、DNS-01 solver（阿里云 DNS / Route53）及 ACME 服务器。
# 禁止将 ACME 账户私钥或云 API Token 提交到仓库 — 使用 External Secrets / Vault（T0.7）。
#
# 安装 cert-manager（若未安装）:
#   helm repo add jetstack https://charts.jetstack.io
#   helm install cert-manager jetstack/cert-manager \
#     -n cert-manager --create-namespace --set installCRDs=true

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/part-of: baobao
    baobao.io/component: tls
spec:
  acme:
    # 预发/联调使用 Let's Encrypt Staging，避免速率限制
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: infra@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      # --- ACK 中国：阿里云 DNS-01 占位 ---
      - selector:
          dnsZones:
            - example.com
            # 生产: babygrowth.app
        dns01:
          webhook:
            groupName: acme.example.com
            solverName: alidns
            config:
              # 通过 ExternalSecret 注入，勿写真实 AK/SK
              accessKeyIDSecretRef:
                name: alidns-credentials
                key: access-key-id
              accessKeySecretSecretRef:
                name: alidns-credentials
                key: access-key-secret
              region: cn-hangzhou
      # --- EKS 海外：Route53 DNS-01 占位 ---
      - selector:
          dnsZones:
            - example.com
        dns01:
          route53:
            region: ap-southeast-1
            # IRSA 或 accessKeyIDSecretRef / secretAccessKeySecretRef

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: baobao
    baobao.io/component: tls
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: infra@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - selector:
          dnsZones:
            - babygrowth.app
        dns01:
          webhook:
            groupName: acme.example.com
            solverName: alidns
            config:
              accessKeyIDSecretRef:
                name: alidns-credentials
                key: access-key-id
              accessKeySecretSecretRef:
                name: alidns-credentials
                key: access-key-secret
              region: cn-hangzhou
      - selector:
          dnsZones:
            - babygrowth.app
        dns01:
          route53:
            region: ap-southeast-1

---
# 开发环境 Certificate 示例 — api-cn + ws-cn 同证书 SAN
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: baobao-gateway-dev-api-cn
  namespace: gateway
  labels:
    app.kubernetes.io/part-of: baobao
    baobao.io/environment: dev
    baobao.io/region: cn
spec:
  secretName: baobao-gateway-dev-api-cn-tls
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - dev-api-cn.example.com
    - dev-ws-cn.example.com
  privateKey:
    algorithm: ECDSA
    size: 256

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: baobao-gateway-dev-api-os
  namespace: gateway
  labels:
    app.kubernetes.io/part-of: baobao
    baobao.io/environment: dev
    baobao.io/region: os
spec:
  secretName: baobao-gateway-dev-api-os-tls
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - dev-api-os.example.com
    - dev-ws-os.example.com
  privateKey:
    algorithm: ECDSA
    size: 256

---
# APISIX TLS 资源 — 将 cert-manager Secret 绑定到网关 SNI
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: baobao-dev-api-cn-tls
  namespace: gateway
spec:
  hosts:
    - dev-api-cn.example.com
    - dev-ws-cn.example.com
  secret:
    name: baobao-gateway-dev-api-cn-tls
    namespace: gateway

---
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: baobao-dev-api-os-tls
  namespace: gateway
spec:
  hosts:
    - dev-api-os.example.com
    - dev-ws-os.example.com
  secret:
    name: baobao-gateway-dev-api-os-tls
    namespace: gateway
