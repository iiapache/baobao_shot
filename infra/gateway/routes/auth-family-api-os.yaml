# auth-family-svc 网关路由 — 海外区 dev（eks-os）
# 与 auth-family-api.yaml 结构相同，仅 hosts 不同

---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: auth-family-api-os
  labels:
    app.kubernetes.io/part-of: baobao
    baobao.io/region: os
    baobao.io/task: T1.12
spec:
  ingressClassName: apisix
  http:
    - name: auth-refresh-os
      priority: 96
      match:
        hosts:
          - dev-api-os.example.com
        paths:
          - /v1/auth/refresh
        methods:
          - POST
      backends:
        - serviceName: auth-family-svc
          servicePort: 80

    - name: auth-phone-code-os
      priority: 96
      match:
        hosts:
          - dev-api-os.example.com
        paths:
          - /v1/auth/phone/code
        methods:
          - POST
      backends:
        - serviceName: auth-family-svc
          servicePort: 80
      plugins:
        - name: serverless-pre-function
          enable: true
          config:
            phase: rewrite
            functions:
              - |
                return function(conf, ctx)
                  local core = require("apisix.core")
                  local cjson = require("cjson.safe")
                  local body = core.request.get_body()
                  if body then
                    local data = cjson.decode(body)
                    if data and data.phone then
                      core.request.set_header("X-Baobao-Rate-Phone", tostring(data.phone))
                    end
                  end
                end
        - name: limit-count
          enable: true
          config:
            count: 3
            time_window: 60
            key_type: var_combination
            key: "$http_x_baobao_rate_phone $remote_addr"
            rejected_code: 429
            rejected_msg: '{"code":"COMMON_RATE_LIMIT","message":"rate limit exceeded"}'
            policy: local
        - name: limit-count
          enable: true
          config:
            count: 10
            time_window: 3600
            key_type: var_combination
            key: "$http_x_baobao_rate_phone $remote_addr"
            rejected_code: 429
            rejected_msg: '{"code":"COMMON_RATE_LIMIT","message":"rate limit exceeded"}'
            policy: local

    - name: auth-phone-login-os
      priority: 96
      match:
        hosts:
          - dev-api-os.example.com
        paths:
          - /v1/auth/phone/login
        methods:
          - POST
      backends:
        - serviceName: auth-family-svc
          servicePort: 80
      plugins:
        - name: serverless-pre-function
          enable: true
          config:
            phase: rewrite
            functions:
              - |
                return function(conf, ctx)
                  local core = require("apisix.core")
                  local cjson = require("cjson.safe")
                  local body = core.request.get_body()
                  if body then
                    local data = cjson.decode(body)
                    if data and data.phone then
                      core.request.set_header("X-Baobao-Rate-Phone", tostring(data.phone))
                    end
                  end
                end
        - name: limit-count
          enable: true
          config:
            count: 5
            time_window: 60
            key_type: var_combination
            key: "$http_x_baobao_rate_phone $remote_addr"
            rejected_code: 429
            rejected_msg: '{"code":"COMMON_RATE_LIMIT","message":"rate limit exceeded"}'
            policy: local

    - name: auth-apple-os
      priority: 96
      match:
        hosts:
          - dev-api-os.example.com
        paths:
          - /v1/auth/apple
        methods:
          - POST
      backends:
        - serviceName: auth-family-svc
          servicePort: 80

    - name: auth-account-protected-os
      priority: 85
      match:
        hosts:
          - dev-api-os.example.com
        paths:
          - /v1/account/*
      backends:
        - serviceName: auth-family-svc
          servicePort: 80
      plugins:
        - name: forward-auth
          enable: true
          config:
            uri: "http://auth-family-svc:80/internal/verify"
            request_headers:
              - Authorization
              - X-Request-Id
              - X-Trace-Id
            upstream_headers:
              - X-User-Id
              - X-Token-Jti
            client_headers:
              - X-User-Id
            status_on_error: 401

    - name: auth-families-protected-os
      priority: 85
      match:
        hosts:
          - dev-api-os.example.com
        paths:
          - /v1/families
          - /v1/families/*
      backends:
        - serviceName: auth-family-svc
          servicePort: 80
      plugins:
        - name: forward-auth
          enable: true
          config:
            uri: "http://auth-family-svc:80/internal/verify"
            request_headers:
              - Authorization
              - X-Request-Id
              - X-Trace-Id
            upstream_headers:
              - X-User-Id
              - X-Token-Jti
            client_headers:
              - X-User-Id
            status_on_error: 401

    - name: auth-invitations-protected-os
      priority: 85
      match:
        hosts:
          - dev-api-os.example.com
        paths:
          - /v1/invitations/*
      backends:
        - serviceName: auth-family-svc
          servicePort: 80
      plugins:
        - name: forward-auth
          enable: true
          config:
            uri: "http://auth-family-svc:80/internal/verify"
            request_headers:
              - Authorization
              - X-Request-Id
              - X-Trace-Id
            upstream_headers:
              - X-User-Id
              - X-Token-Jti
            client_headers:
              - X-User-Id
            status_on_error: 401
