# baobao-gateway 默认 values
# 安装前：helm repo add apisix https://charts.apiseven.com && helm dependency update
#
# 网关选型：Apache APISIX（design-backend §2/§9：Kong 或 APISIX，本项目选用 APISIX，
# 原因：ACK/EKS 双集群均有成熟 Helm 支持；原生 ApisixRoute CRD；HTTP/2 + TLS 1.3 可配置）

global:
  cluster: local
  region: cn
  environment: dev

# ---------------------------------------------------------------------------
# APISIX 子 chart values（前缀 apisix. 透传至官方 chart）
# 文档：https://github.com/apache/apisix-helm-chart/blob/master/charts/apisix/values.yaml
# ---------------------------------------------------------------------------
apisix:
  enabled: true

  replicaCount: 2

  # TLS 终止在网关层；证书由 cert-manager 写入 Secret，见 tls/ 与 routes/
  ssl:
    enabled: true

  # HTTP/2：APISIX 在启用 SSL 后默认开启 HTTP/2（见 tls/README.md）
  enableHttp2: true

  # 强制 TLS 1.3（禁用 TLS 1.2 及以下）
  set_config:
    apisix:
      ssl:
        ssl_protocols: "TLSv1.3"
        # 现代 AEAD 套件；生产可按合规要求收紧
        ssl_ciphers: "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256"
        ssl_prefer_server_ciphers: "on"

  gateway:
    type: LoadBalancer
    # ACK/EKS 云 LB 注解在 values-ack-cn.yaml / values-eks-os.yaml 覆盖
    annotations: {}

  ingress-controller:
    enabled: true
    config:
      apisix:
        # 与 Release 命名空间一致；安装时 -n gateway 则改为 gateway
        serviceNamespace: gateway
    ingressClass: apisix

  # 健康检查端点（网关自身）
  customPlugins:
    enabled: false

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  etcd:
    enabled: true
    replicaCount: 1
    persistence:
      enabled: false

# ---------------------------------------------------------------------------
# baobao 网关层配置（本 chart 模板消费）
# ---------------------------------------------------------------------------
gateway:
  # 对外域名 — 完整映射见 domains/mapping.yaml
  hosts:
    api: api-cn.example.com
    ws: ws-cn.example.com

  # 上游服务（与 infra/k8s 微服务对齐）
  upstream:
    hello:
      namespace: dev
      serviceName: hello
      servicePort: 80
    authFamily:
      namespace: dev
      serviceName: auth-family-svc
      servicePort: 80
      # JWT forward-auth 校验端点（集群内，不经公网）
      verifyPath: /internal/verify

  tls:
    # cert-manager Certificate 名称前缀；实际 Secret 由 Certificate 资源创建
    secretPrefix: baobao-gateway
    # 强制 HTTPS 重定向
    forceHttps: true

commonLabels:
  baobao.io/component: gateway
  baobao.io/managed-by: helm

commonAnnotations: {}
