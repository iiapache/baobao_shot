{{- if .Values.gateway.tls.forceHttps }}
# APISIX 全局 SSL 策略 ConfigMap — 供运维核对 TLS 1.3 / HTTP/2 配置
# 实际生效配置由 apisix.set_config 写入 APISIX 数据面；本资源为可观测性文档化
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gateway.fullname" . }}-tls-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
  annotations:
    baobao.io/tls-protocols: "TLSv1.3"
    baobao.io/http2: "enabled"
    baobao.io/doc: "infra/gateway/tls/README.md"
data:
  ssl_protocols: "TLSv1.3"
  ssl_ciphers: "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256"
  enable_http2: "true"
  force_https: {{ .Values.gateway.tls.forceHttps | quote }}
  api_host: {{ .Values.gateway.hosts.api | quote }}
  ws_host: {{ .Values.gateway.hosts.ws | quote }}
{{- end }}
