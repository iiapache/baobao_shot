# PostgreSQL 15 — dev/staging 简化 StatefulSet（无需 Helm）
# 单节点，适用于 kind/minikube 或快速验证
# 用法: kubectl apply -f statefulset-dev.yaml -n dev
#
# 密码通过 Secret 注入，示例：
#   kubectl create secret generic baobao-postgresql-dev -n dev \
#     --from-literal=postgres-password="${POSTGRES_PASSWORD}" \
#     --from-literal=password="${POSTGRES_PASSWORD}"

---
apiVersion: v1
kind: Secret
metadata:
  name: baobao-postgresql-dev
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: baobao
    baobao.io/data-store: postgresql
type: Opaque
stringData:
  postgres-password: "REPLACE_ME_POSTGRES"
  password: "REPLACE_ME_POSTGRES"

---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: baobao
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: postgresql

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: baobao
    baobao.io/data-store: postgresql
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/part-of: baobao
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
    spec:
      containers:
        - name: postgresql
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_USER
              value: baobao
            - name: POSTGRES_DB
              value: baobao
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: baobao-postgresql-dev
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          args:
            - postgres
            - -c
            - log_min_duration_statement=500
            - -c
            - shared_preload_libraries=pg_stat_statements
            - -c
            - max_connections=200
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "baobao", "-d", "baobao"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "baobao", "-d", "baobao"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
