# 阿里云 CDN 回源配置模板 — 中国区
# 域名占位：cdn-cn.babygrowth.app → OSS baby-camera-cn
# 部署：阿里云 CDN 控制台 / Terraform alicloud_cdn_domain_config

domain: cdn-cn.babygrowth.app
region: cn-hangzhou
origin:
  type: oss
  bucket: baby-camera-cn
  # 私有桶回源鉴权：RAM 角色 + CDN 回源鉴权（勿在仓库写 AK/SK）
  privateBucketAccess: true
  originRoleArn: "${CDN_ORIGIN_RAM_ROLE_ARN}"

cacheRules:
  - path: "/family/*/thumb/*"
    ttlSeconds: 86400
    cacheKey: ["path"]
  - path: "/family/*"
    ttlSeconds: 3600
    cacheKey: ["path"]
  - path: "/ai-out/*"
    ttlSeconds: 3600
    cacheKey: ["path"]
  - path: "/avatar/*"
    ttlSeconds: 86400
    cacheKey: ["path"]

https:
  forceRedirect: true
  http2: true
  tlsMinVersion: "TLSv1.2"

headers:
  # 禁止 CDN 缓存 ai-tmp（临时区仅直传，不经 CDN 分发）
  denyCachePrefixes:
    - "ai-tmp/"
