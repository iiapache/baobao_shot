# Helm values — 蓝绿策略（路径 A：Argo Rollouts）
# 在 Application / ApplicationSet helm.valueFiles 中追加：
#   - ../../../argocd/rollout/values-blue-green.yaml
#
# 演练：preview 验证 → kubectl argo rollouts promote <service>
# 回滚：scripts/ops/rollback-service.sh --strategy blue-green

rollout:
  enabled: true
  strategy: blueGreen

  blueGreen:
    activeService: "{{ .Release.Name }}-active"
    previewService: "{{ .Release.Name }}-preview"
    autoPromotionEnabled: false
    scaleDownDelaySeconds: 30
    previewReplicaCount: 1

commonLabels:
  baobao.io/deployment-strategy: blue-green

commonAnnotations:
  argocd.argoproj.io/sync-wave: "1"

# 镜像由 CI GitOps 更新
image:
  repository: registry.example.com/baobao/hello
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 2

ingress:
  enabled: false   # 流量经 APISIX 网关
