# Helm values — Canary 灰度 5%（T7.11 演练第一步）
# 配合 scripts/ops/traffic-shift.sh --weight 5
#
# Application valueFiles 追加顺序（后覆盖前）：
#   - values-canary-5.yaml   ← 当前
#   - values-canary-25.yaml  ← 第二步
#   - values-canary-100.yaml ← 全量

rollout:
  enabled: true
  strategy: canary

  canary:
    canaryService: "{{ .Release.Name }}-canary"
    stableService: "{{ .Release.Name }}-stable"
    trafficRouting:
      apisix:
        routeName: hello-api
        namespace: gateway
    steps:
      - setWeight: 5
      - pause: { duration: 5m }

commonLabels:
  baobao.io/deployment-strategy: canary
  baobao.io/canary-weight: "5"

commonAnnotations:
  argocd.argoproj.io/sync-wave: "1"
  baobao.io/canary-weight: "5"

image:
  repository: registry.example.com/baobao/hello
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 2

ingress:
  enabled: false
  annotations:
    baobao.io/canary-weight: "5"
