# ApplicationSet — staging 环境多集群微服务部署（ENV-03）
# 使用前替换 spec.generators[].matrix.generators[].git.repoURL
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: baobao-staging
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: baobao
    baobao.io/environment: staging
    baobao.io/task: ENV-03
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - cluster: ack-cn
                  region: cn
                  outboundValues: ../../../staging/values/ack-cn-outbound.yaml
                - cluster: eks-os
                  region: os
                  outboundValues: ../../../staging/values/eks-os-outbound.yaml
          - list:
              elements:
                - release: baobao-staging
                  chartPath: infra/k8s/charts/baobao-staging
                  namespace: staging
  template:
    metadata:
      name: "{{ .release }}-{{ .cluster }}"
      labels:
        app.kubernetes.io/part-of: baobao
        baobao.io/cluster: "{{ .cluster }}"
        baobao.io/region: "{{ .region }}"
        baobao.io/environment: staging
        baobao.io/release: "{{ .release }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://gitlab.example.com/baobao/baobao.git
        targetRevision: main
        path: "{{ .chartPath }}"
        helm:
          releaseName: "{{ .release }}"
          valueFiles:
            - "../../clusters/{{ .cluster }}/cluster-values.yaml"
            - "../../clusters/{{ .cluster }}/staging-services-values.yaml"
            - "{{ .outboundValues }}"
            - "../../../staging/values/auth-family-svc.yaml"
            - "../../../staging/values/media-svc.yaml"
            - "../../../staging/values/feed-svc.yaml"
            - "../../../staging/values/audit-svc.yaml"
            - "../../../staging/values/ai-dispatch-svc.yaml"
            - "../../../staging/values/credit-sub-ad-svc.yaml"
      destination:
        name: "{{ .cluster }}"
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
          - ApplyOutOfSyncOnly=true
      revisionHistoryLimit: 5
