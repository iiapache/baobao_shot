# ACK 中国 staging — 三方 Mock 基址（合并到各微服务 Helm release）
# 对应 outbound-mapping.yaml k8s.hosts

global:
  environment: staging
  region: cn
  cluster: ack-cn

outbound:
  mockNamespace: staging
  mockRelease: third-party-mocks
  mockPort: 8080
  urls:
    appleIap: http://mock-iap.third-party-mocks.svc.cluster.local:8080
    wechatOpen: http://mock-wechat.third-party-mocks.svc.cluster.local:8080
    adSsv: http://mock-ad.third-party-mocks.svc.cluster.local:8080
    auditGreen: http://mock-audit.third-party-mocks.svc.cluster.local:8080
    aiModels: http://mock-ai.third-party-mocks.svc.cluster.local:8080
