# hello 服务 observability 接入示例
#
# 展示 OTEL tracing + Prometheus scrape 注解，与 services/_template/go 环境变量对齐。
#
# kubectl apply -f infra/observability/examples/hello-observability.yaml
#
# 注意：hello 镜像需已部署；本清单仅 patch Deployment env/annotations 或作参考。

---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: dev
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/part-of: baobao
spec:
  selector:
    app.kubernetes.io/name: hello
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: dev
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/part-of: baobao
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: hello
          image: registry.example.com/baobao/hello:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: hello
            - name: HTTP_PORT
              value: "8080"
            - name: GRPC_PORT
              value: "9090"
            - name: ENVIRONMENT
              value: dev
            # 与 services/_template/go internal/middleware/tracing.go 对齐
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: otel-collector.observability.svc:4317
            # Sentry — DSN 从 Secret 注入（见 sentry/README.md）
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: baobao-sentry
                  key: backend-dsn
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
