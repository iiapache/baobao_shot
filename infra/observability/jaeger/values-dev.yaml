# Jaeger all-in-one — dev（可选，默认用 Tempo）
#
# helm upgrade --install jaeger jaegertracing/jaeger \
#   -n observability -f infra/observability/jaeger/values-dev.yaml

provisionDataStore:
  cassandra: false
  elasticsearch: false

allInOne:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

storage:
  type: memory

agent:
  enabled: false

collector:
  enabled: false

query:
  enabled: false
