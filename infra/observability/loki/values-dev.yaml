# Grafana Loki — dev 日志聚合
#
# helm repo add grafana https://grafana.github.io/helm-charts
# helm upgrade --install loki grafana/loki -n observability \
#   -f infra/observability/loki/values-dev.yaml

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 168h  # 7 天

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

gateway:
  enabled: true
  replicas: 1

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus

test:
  enabled: false
