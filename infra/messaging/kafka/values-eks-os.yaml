# EKS 海外区 Kafka values 覆盖 — 合并 helm-values.yaml 使用
# helm upgrade --install kafka oci://registry-1.docker.io/bitnamicharts/kafka \
#   -f infra/messaging/kafka/helm-values.yaml \
#   -f infra/messaging/kafka/values-eks-os.yaml \
#   -n baobao-messaging

global:
  storageClass: gp3

broker:
  persistence:
    size: 100Gi

metrics:
  serviceMonitor:
    labels:
      cluster: eks-os
      region: os
