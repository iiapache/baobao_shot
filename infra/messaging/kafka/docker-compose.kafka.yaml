# 本地 Kafka 片段 — 可合并到项目根 docker-compose 或独立启动
# 启动：docker compose -f infra/messaging/kafka/docker-compose.kafka.yaml up -d
# 说明：本地为单 broker PLAINTEXT 简化拓扑；生产 3 broker 见 helm-values.yaml

services:
  kafka:
    image: bitnami/kafka:3.7.1
    container_name: baobao-kafka-local
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # KRaft 单节点（本地开发）
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # 与 topics.yaml 默认值对齐
      KAFKA_CFG_NUM_PARTITIONS: "3"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_CFG_MIN_INSYNC_REPLICAS: "1"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_LOG_RETENTION_HOURS: "168"
      KAFKA_CFG_COMPRESSION_TYPE: "lz4"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-init-topics:
    image: bitnami/kafka:3.7.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        BS=kafka:9092
        for t in ai.events iap.events feed.events credit.events; do
          kafka-topics.sh --bootstrap-server "$$BS" --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 1
        done
        echo "Topics ready: ai.events iap.events feed.events credit.events"
    restart: "no"

volumes:
  kafka_data:
