# External Secrets Operator (ESO) 示例 — 从 Vault 同步 baobao-postgresql Secret
# 与 infra/data/postgresql/values.yaml existingSecret: baobao-postgresql 对齐
#
# 安装 ESO: helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
# 部署: kubectl apply -f infra/vault/kubernetes/external-secrets-example.yaml -n dev

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-dev-cn
  namespace: dev
spec:
  provider:
    vault:
      server: "http://vault.vault-dev.svc.cluster.local:8200"
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-dev
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: dev
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: baobao-postgresql
  namespace: dev
  labels:
    app.kubernetes.io/name: postgresql
    baobao.io/data-store: postgresql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-dev-cn
    kind: SecretStore
  target:
    name: baobao-postgresql
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: postgresql
          baobao.io/managed-by: external-secrets
  data:
    - secretKey: postgres-password
      remoteRef:
        key: dev/cn/shared/postgres-auth-family
        property: postgres_password
    - secretKey: password
      remoteRef:
        key: dev/cn/shared/postgres-auth-family
        property: password
---
# ai-dispatch-svc 模型 API Key — 应用 Pod 直接挂载 K8s Secret（非 Bitnami DB Secret）
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-dispatch-model-keys
  namespace: dev
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-dev-cn
    kind: SecretStore
  target:
    name: ai-dispatch-model-keys
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dev/cn/ai-dispatch/bytedance
    - extract:
        key: dev/cn/ai-dispatch/alibaba-dashscope
