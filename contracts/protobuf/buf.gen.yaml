# Go gRPC 代码生成（由 tools/protobuf 或各服务 Makefile 调用）
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/baobao/gen
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: gen
    opt:
      - paths=source_relative
