components:
  schemas:
    ApiResponse:
      type: object
      required: [code, requestId]
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
          example: ok
        requestId:
          type: string
          example: req_01HZX
        data:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [code, requestId]
      properties:
        code:
          type: string
          example: COMMON_BAD_PARAM
        message:
          type: string
        requestId:
          type: string

    PaginatedItems:
      type: object
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: string
          nullable: true

    UserProfile:
      type: object
      properties:
        nickname:
          type: string
        avatarUrl:
          type: string
          nullable: true
        region:
          type: string
          enum: [cn, os]
        consents:
          type: object
          properties:
            childData:
              type: boolean

    AuthTokens:
      type: object
      required:
        - userId
        - accessToken
        - accessTokenExpiresIn
        - refreshToken
        - refreshTokenExpiresIn
        - profile
      properties:
        userId:
          type: string
          example: usr_01HZ
        isNewUser:
          type: boolean
        accessToken:
          type: string
        accessTokenExpiresIn:
          type: integer
          format: int32
        refreshToken:
          type: string
        refreshTokenExpiresIn:
          type: integer
          format: int32
        profile:
          $ref: '#/components/schemas/UserProfile'

    FamilySummary:
      type: object
      properties:
        familyId:
          type: string
          example: fam_01HZ
        name:
          type: string
        role:
          type: string
          enum: [admin, family, guest]

    BabySummary:
      type: object
      properties:
        babyId:
          type: string
          example: bb_01HZ
        name:
          type: string
        birthday:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, unknown]

  parameters:
    FamilyId:
      name: familyId
      in: path
      required: true
      schema:
        type: string
    BabyId:
      name: babyId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    InvitationCode:
      name: code
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    HeaderXRegion:
      name: X-Region
      in: header
      required: true
      schema:
        type: string
        enum: [cn, os]
    HeaderXAppVersion:
      name: X-App-Version
      in: header
      required: true
      schema:
        type: string
    HeaderXDeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 鉴权失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
