# design-api.md §6 AI 任务
paths:
  /v1/ai/plays:
    get:
      tags: [ai]
      summary: 玩法目录
      operationId: aiListPlays
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 玩法列表
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ApiResponse'

  /v1/ai/tasks:
    post:
      tags: [ai]
      summary: 提交 AI 任务
      operationId: aiCreateTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [play, inputObjectKey, familyId]
              properties:
                play:
                  type: string
                inputObjectKey:
                  type: string
                familyId:
                  type: string
                params:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: 任务已创建
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ApiResponse'
        '422':
          description: 业务校验未通过
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ErrorResponse'
    get:
      tags: [ai]
      summary: 用户 AI 任务历史（分页）
      operationId: aiListTasks
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/Cursor'
        - $ref: '../components/common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ApiResponse'

  /v1/ai/tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [ai]
      summary: 查询任务
      operationId: aiGetTask
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ApiResponse'

  /v1/ai/tasks/{taskId}/cancel:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [ai]
      summary: 取消任务
      operationId: aiCancelTask
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ApiResponse'

  /v1/ai/tasks/{taskId}/appeal:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [ai]
      summary: 申诉（仅 rejected）
      operationId: aiAppealTask
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 申诉已提交
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ApiResponse'
