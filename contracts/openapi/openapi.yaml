openapi: 3.0.3
info:
  title: 宝宝成长相机 REST API
  version: 1.0.0
  description: |
    端 ↔ 后端 REST 契约，对齐 [design-api.md](../../docs/design-api.md)。
    大版本 URI 前缀 `v1`；非破坏性变更仅增字段，破坏性变更升至 `v2`。
  contact:
    name: baobao API
  license:
    name: Proprietary

servers:
  - url: https://api-cn.babygrowth.app
    description: 中国区域
  - url: https://api-os.babygrowth.app
    description: 海外区域

tags:
  - name: auth
    description: 鉴权（design-api §3）
  - name: account
    description: 账号（design-api §3）
  - name: family
    description: 家庭（design-api §4.1）
  - name: baby
    description: 宝宝档案（design-api §4.2）
  - name: upload
    description: 媒体上传（design-api §5）
  - name: ai
    description: AI 任务（design-api §6）
  - name: feed
    description: 家庭圈（design-api §7）
  - name: credits
    description: 积分（design-api §8.1）
  - name: subscriptions
    description: 订阅（design-api §8.2）
  - name: caption
    description: 智能文案（design-api §9）
  - name: notifications
    description: 通知（design-api §10）
  - name: backup
    description: 备份凭据（design-api §11）
  - name: config
    description: 灰度与运营配置（config-svc）

