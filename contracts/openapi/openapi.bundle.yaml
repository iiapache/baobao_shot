openapi: 3.0.3
info:
  title: 宝宝成长相机 REST API
  version: 1.0.0
  description: |
    端 ↔ 后端 REST 契约，对齐 [design-api.md](../../docs/design-api.md)。
    大版本 URI 前缀 `v1`；非破坏性变更仅增字段，破坏性变更升至 `v2`。
  contact:
    name: baobao API
  license:
    name: Proprietary
servers:
  - url: https://api-cn.babygrowth.app
    description: 中国区域
  - url: https://api-os.babygrowth.app
    description: 海外区域
security:
  - bearerAuth: []
tags:
  - name: auth
    description: 鉴权（design-api §3）
  - name: account
    description: 账号（design-api §3）
  - name: family
    description: 家庭（design-api §4.1）
  - name: baby
    description: 宝宝档案（design-api §4.2）
  - name: upload
    description: 媒体上传（design-api §5）
  - name: ai
    description: AI 任务（design-api §6）
  - name: feed
    description: 家庭圈（design-api §7）
  - name: credits
    description: 积分（design-api §8.1）
  - name: subscriptions
    description: 订阅（design-api §8.2）
  - name: caption
    description: 智能文案（design-api §9）
  - name: notifications
    description: 通知（design-api §10）
  - name: backup
    description: 备份凭据（design-api §11）
  - name: config
    description: 灰度与运营配置（config-svc）
paths:
  /v1/auth/apple:
    post:
      tags:
        - auth
      summary: Apple ID 登录 / 注册
      operationId: authAppleLogin
      security: []
      parameters:
        - $ref: '#/components/parameters/HeaderXRegion'
        - $ref: '#/components/parameters/HeaderXAppVersion'
        - $ref: '#/components/parameters/HeaderXDeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identityToken
                - authorizationCode
                - region
              properties:
                identityToken:
                  type: string
                authorizationCode:
                  type: string
                nickname:
                  type: string
                region:
                  type: string
                  enum:
                    - cn
                    - os
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/phone/code:
    post:
      tags:
        - auth
      summary: 发送短信验证码（仅中国区）
      operationId: authPhoneSendCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '429':
          description: 限流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/phone/login:
    post:
      tags:
        - auth
      summary: 手机号 + 验证码登录 / 注册
      operationId: authPhoneLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokens'
  /v1/auth/refresh:
    post:
      tags:
        - auth
      summary: 刷新 Access Token（Refresh Rotation）
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/account/logout:
    post:
      tags:
        - account
      summary: 主动登出（撤销当前会话）
      operationId: accountLogout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /v1/account/me:
    get:
      tags:
        - account
      summary: 获取当前用户基本信息
      operationId: accountGetMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
    patch:
      tags:
        - account
      summary: 更新昵称 / 头像
      operationId: accountUpdateMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                avatarUrl:
                  type: string
                  nullable: true
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /v1/account/consents/child-data:
    post:
      tags:
        - account
      summary: 提交监护人同意
      operationId: accountSubmitChildConsent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
                - accepted
              properties:
                version:
                  type: string
                accepted:
                  type: boolean
      responses:
        '200':
          description: 提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          description: 业务校验未通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/account:
    delete:
      tags:
        - account
      summary: 注销账号（异步处理 + 软删 + 7 天可撤销）
      operationId: accountDelete
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 注销已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/families:
    post:
      tags:
        - family
      summary: 创建家庭
      operationId: familyCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '409':
          description: 家庭数量达上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - family
      summary: 获取我加入的家庭列表
      operationId: familyListMine
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 家庭列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/FamilySummary'
  /v1/families/{familyId}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      tags:
        - family
      summary: 家庭详情（含成员、宝宝）
      operationId: familyGet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 家庭详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - family
      summary: 修改家庭名称
      operationId: familyUpdate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - family
      summary: 解散家庭（管理员）
      operationId: familyDelete
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 解散成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/families/{familyId}/invitations:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    post:
      tags:
        - family
      summary: 生成邀请码
      operationId: familyCreateInvitation
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 邀请码
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /v1/families/{familyId}/invitations/{code}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
      - $ref: '#/components/parameters/InvitationCode'
    delete:
      tags:
        - family
      summary: 立即作废邀请码
      operationId: familyRevokeInvitation
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 作废成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /v1/invitations/{code}/join:
    parameters:
      - $ref: '#/components/parameters/InvitationCode'
    post:
      tags:
        - family
      summary: 通过邀请码加入家庭
      operationId: familyJoinByInvitation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - relation
              properties:
                relation:
                  type: string
                nickname:
                  type: string
      responses:
        '200':
          description: 加入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '409':
          description: 邀请码已用尽或成员达上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/families/{familyId}/transfer:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    post:
      tags:
        - family
      summary: 主动转让管理员
      operationId: familyTransferAdmin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetUserId
              properties:
                targetUserId:
                  type: string
      responses:
        '200':
          description: 转让成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /v1/families/{familyId}/takeover:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    post:
      tags:
        - family
      summary: 发起 / 投票失联接管
      operationId: familyTakeover
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 接管流程状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /v1/families/{familyId}/members:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      tags:
        - family
      summary: 成员列表
      operationId: familyListMembers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成员列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /v1/families/{familyId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags:
        - family
      summary: 修改成员角色 / 备注
      operationId: familyUpdateMember
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                    - admin
                    - family
                    - guest
                nickname:
                  type: string
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - family
      summary: 移除成员
      operationId: familyRemoveMember
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 移除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /v1/families/{familyId}/babies:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    post:
      tags:
        - baby
      summary: 创建宝宝档案
      operationId: babyCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - birthday
              properties:
                name:
                  type: string
                birthday:
                  type: string
                  format: date
                gender:
                  type: string
                  enum:
                    - male
                    - female
                    - unknown
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - baby
      summary: 获取家庭的宝宝列表
      operationId: babyListByFamily
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 宝宝列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/BabySummary'
  /v1/babies/{babyId}:
    parameters:
      - $ref: '#/components/parameters/BabyId'
    get:
      tags:
        - baby
      summary: 宝宝详情
      operationId: babyGet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 宝宝详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - baby
      summary: 修改宝宝档案
      operationId: babyUpdate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                birthday:
                  type: string
                  format: date
                gender:
                  type: string
                  enum:
                    - male
                    - female
                    - unknown
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - baby
      summary: 删除宝宝档案（软删）
      operationId: babyDelete
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /v1/babies/{babyId}/milestones:
    parameters:
      - $ref: '#/components/parameters/BabyId'
    post:
      tags:
        - baby
      summary: 添加自定义里程碑
      operationId: babyAddMilestone
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - occurredAt
              properties:
                title:
                  type: string
                occurredAt:
                  type: string
                  format: date
      responses:
        '200':
          description: 添加成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - baby
      summary: 获取里程碑列表（含内置 + 自定义）
      operationId: babyListMilestones
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 里程碑列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /v1/uploads/init:
    post:
      tags:
        - upload
      summary: 申请 OSS 直传凭据
      operationId: uploadInit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - purpose
                - items
              properties:
                purpose:
                  type: string
                  enum:
                    - ai-input
                    - post-item
                familyId:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      clientRef:
                        type: string
                      kind:
                        type: string
                      mime:
                        type: string
                      size:
                        type: integer
                      sha256:
                        type: string
      responses:
        '200':
          description: 直传凭据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /v1/uploads/complete:
    post:
      tags:
        - upload
      summary: 完成上传回调
      operationId: uploadComplete
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 上传完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /v1/ai/plays:
    get:
      tags:
        - ai
      summary: 玩法目录
      operationId: aiListPlays
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 玩法列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /v1/ai/tasks:
    post:
      tags:
        - ai
      summary: 提交 AI 任务
      operationId: aiCreateTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - play
                - inputObjectKey
                - familyId
              properties:
                play:
                  type: string
                inputObjectKey:
                  type: string
                familyId:
                  type: string
                params:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: 任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          description: 业务校验未通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - ai
      summary: 用户 AI 任务历史（分页）
      operationId: aiListTasks
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /v1/ai/tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - ai
      summary: 查询任务
      operationId: aiGetTask
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /v1/ai/tasks/{taskId}/cancel:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - ai
      summary: 取消任务
      operationId: aiCancelTask
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /v1/ai/tasks/{taskId}/appeal:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - ai
      summary: 申诉（仅 rejected）
      operationId: aiAppealTask
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 申诉已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /v1/posts:
    post:
      tags:
        - feed
      summary: 发布作品
      operationId: postCreate
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 发布成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /v1/posts/{postId}:
    parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - feed
      summary: 作品详情
      operationId: postGet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 作品详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - feed
      summary: 撤回发布
      operationId: postDelete
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 撤回成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /v1/feeds/family:
    get:
      tags:
        - feed
      summary: 家庭 Feed
      operationId: feedListFamily
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Feed 列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
