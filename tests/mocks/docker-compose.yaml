# Baobao 三方 Mock — docker compose
# 任务 T0.20 · WireMock 3.x

services:
  mock-api:
    image: wiremock/wiremock:3.9.1
    container_name: baobao-mock-api
    ports:
      - "18080:8080"
    volumes:
      - ./api/mappings:/home/wiremock/mappings:ro
    command: ["--global-response-templating", "--verbose"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  mock-iap:
    image: wiremock/wiremock:3.9.1
    container_name: baobao-mock-iap
